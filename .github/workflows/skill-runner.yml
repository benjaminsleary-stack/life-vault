# Skill runner — on-demand path. Executes skills the dashboard queues as
# inbox/_runs/<skill>-<ts>.run trigger files (committed via the Worker).
#
# This is the LAPTOP-OFF fallback: when the desktop watcher
# (scripts/skill-runner-local.py) is running it claims triggers first and this
# stays idle. The `sleep + re-pull` below yields that window so the two never
# double-run. Scheduled runs live in scheduled-skills.yml, not here.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (repo secret). Never deletes a trigger — archives
# it to inbox/_runs/_archive/ (golden rule 1).

name: skill-runner

on:
  push:
    paths:
      # Only live triggers — archiving a processed .run must not re-fire the
      # workflow (it archives into inbox/_runs/_archive/).
      - "inbox/_runs/*.run"
      - "!inbox/_runs/_archive/**"
  workflow_dispatch: {}

permissions:
  contents: write

# Distinct group from scheduled-skills: sharing one group means a third entrant
# CANCELS the pending run (GitHub keeps 1 running + 1 queued per group), which
# could silently skip a queued brief.
concurrency:
  group: skill-runner-ondemand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      UNLOCK_TOKEN: ${{ secrets.UNLOCK_TOKEN }}
      ICS_URL: ${{ secrets.ICS_URL }}
      CAL_WORK: ${{ secrets.CAL_WORK }}
      CAL_PERSONAL: ${{ secrets.CAL_PERSONAL }}
      CAL_FAMILY: ${{ secrets.CAL_FAMILY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # process the latest queue, not the trigger SHA
          fetch-depth: 0      # full history so rebase-before-push works

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Process queued runs
        run: |
          set -uo pipefail
          # Yield to the desktop watcher, if any: wait briefly then re-pull so
          # triggers it already claimed disappear before we act.
          sleep 30
          git pull --rebase --autostash origin main || true
          bash scripts/process-queue.sh queued

      - name: Commit results
        run: |
          bash scripts/commit-and-push.sh "skill-runner: results $(date -u +%FT%TZ)" "life-vault skill-runner"
