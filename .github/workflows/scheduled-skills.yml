# Scheduled skills — the laptop-off timer. Runs skills in the cloud so outputs
# (e.g. the morning brief) are ready before you wake, desktop off or on.
# These run the skill DIRECTLY (not via a .run trigger), so they never involve
# the local watcher and can't double-run with it.
#
# THE CLOCK IS NOT HERE. It lives in the Cloudflare Worker (`scheduled()` in
# worker/worker.js, times in worker/wrangler.toml), which dispatches this
# workflow. GitHub's own `schedule:` trigger was firing 2½–3¼ hours late every
# day — a 04:45 UTC cron landed between 07:19 and 08:11 across five consecutive
# days — so a brief meant to be waiting at 06:30 turned up mid-morning. A
# `workflow_dispatch` run starts immediately; a `schedule` run queues behind
# GitHub's shared scheduler. Change the times in wrangler.toml, not here.

name: scheduled-skills

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to run now"
        required: true
        default: morning-brief

permissions:
  contents: write

concurrency:
  group: skill-runner-scheduled   # distinct from the on-demand lane — a shared
  cancel-in-progress: false       # group cancels pending runs, skipping briefs

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      UNLOCK_TOKEN: ${{ secrets.UNLOCK_TOKEN }}
      ICS_URL: ${{ secrets.ICS_URL }}
      CAL_WORK: ${{ secrets.CAL_WORK }}
      CAL_PERSONAL: ${{ secrets.CAL_PERSONAL }}
      CAL_FAMILY: ${{ secrets.CAL_FAMILY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code

      # A brief that is written but never delivered has been the failure mode
      # here for twelve days running, on a secret that was present but empty.
      # Say so at the top of the log rather than letting it surface as a quiet
      # line in the hot-cache a fortnight later.
      # A preflight, not a guess. Checking the variables are non-empty only ever
      # caught half the problem: a WRONG unlock token looks identical to a right
      # one until the Worker returns 401, and the whole delivery path is
      # best-effort so that 401 was invisible. This actually calls the Worker.
      - name: Check delivery works
        run: |
          set -uo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${UNLOCK_TOKEN:-}" ]; then
            echo "::warning title=No delivery::WORKER_URL or UNLOCK_TOKEN is unset — the brief will be written and pushed to git, but cannot reach the phone."
            exit 0
          fi
          # Trim, for the same reason notify.sh does: a trailing newline pasted
          # into the secrets box is invisible here and reads as a wrong token.
          tok="$(printf '%s' "$UNLOCK_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          url="$(printf '%s' "$WORKER_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${#tok}" -ne "${#UNLOCK_TOKEN}" ]; then
            echo "Note: UNLOCK_TOKEN had surrounding whitespace (${#UNLOCK_TOKEN} chars -> ${#tok}); using the trimmed value."
          fi
          code="$(curl -sS -o /tmp/devices.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${tok}" "${url%/}/api/push/devices" || echo 000)"
          case "$code" in
            200)
              n="$(node -e 'try{const j=require("/tmp/devices.json");process.stdout.write(String((j.devices||[]).length))}catch(e){process.stdout.write("?")}')"
              if [ "$n" = "0" ]; then
                echo "::warning title=No devices::The Worker is reachable but NO device is registered for notifications. Open the app -> System -> Notifications -> Turn on."
              else
                echo "Delivery preflight OK — $n device(s) registered."
              fi ;;
            401) echo "::warning title=Token mismatch::The Worker rejected UNLOCK_TOKEN (401) even after trimming. The Actions secret (${#tok} characters) does not match the Worker's UNLOCK_TOKEN — briefs and failure alerts will not be delivered. Compare that length against the token you type to unlock the app on your phone; if they match, the value itself differs and both need setting to one fresh value. See docs/deploy-runbook.md." ;;
            000) echo "::warning title=Worker unreachable::Could not reach ${url} at all. Check WORKER_URL." ;;
            *)   echo "::warning title=Delivery preflight failed::The Worker returned HTTP $code for /api/push/devices." ;;
          esac

      - name: Run the requested skill
        env:
          # This lane is the clock, and the clock can fire more than once for the
          # same day (a re-dispatch, a retry, a debugging session). If today's
          # brief is already written, deliver it rather than paying to write it
          # again — on 4 Aug that cost $4.55 for one morning's brief. Deliberate
          # runs started from the dashboard go through the on-demand lane, which
          # does not set this and so is never skipped.
          LV_SKIP_IF_FRESH: "1"
        run: |
          set -uo pipefail
          skill="${{ github.event.inputs.skill }}"
          # "Re-run all jobs" does NOT replay workflow_dispatch inputs, so the
          # skill name comes back empty. Without this the run took 20 seconds,
          # did absolutely nothing, and reported Success — which is exactly the
          # silent failure the rest of this system exists to prevent.
          if [ -z "$skill" ]; then
            echo "::error title=No skill to run::This run has no 'skill' input, which is what happens when you use 'Re-run all jobs' on a dispatched run — GitHub does not replay the inputs. Start a fresh run instead: Actions -> scheduled-skills -> Run workflow -> pick the skill."
            exit 1
          fi
          echo "Running scheduled skill: $skill"
          bash scripts/run-skill.sh "$skill" || true

      # Orphaned on-demand triggers (a crashed run, or a push that never fired
      # the on-demand workflow) would otherwise wait for the next .run commit.
      - name: Sweep leftover queued runs
        run: bash scripts/process-queue.sh leftover

      - name: Commit results
        run: |
          bash scripts/commit-and-push.sh "scheduled-skills: results $(date -u +%FT%TZ)" "life-vault scheduled-skills"
