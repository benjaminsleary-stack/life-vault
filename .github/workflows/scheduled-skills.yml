# Scheduled skills — the laptop-off timer. Runs skills in the cloud so outputs
# (e.g. the morning brief) are ready before you wake, desktop off or on.
# These run the skill DIRECTLY (not via a .run trigger), so they never involve
# the local watcher and can't double-run with it.
#
# THE CLOCK IS NOT HERE. It lives in the Cloudflare Worker (`scheduled()` in
# worker/worker.js, times in worker/wrangler.toml), which dispatches this
# workflow. GitHub's own `schedule:` trigger was firing 2½–3¼ hours late every
# day — a 04:45 UTC cron landed between 07:19 and 08:11 across five consecutive
# days — so a brief meant to be waiting at 06:30 turned up mid-morning. A
# `workflow_dispatch` run starts immediately; a `schedule` run queues behind
# GitHub's shared scheduler. Change the times in wrangler.toml, not here.

name: scheduled-skills

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to run now"
        required: true
        default: morning-brief

permissions:
  contents: write

concurrency:
  group: skill-runner-scheduled   # distinct from the on-demand lane — a shared
  cancel-in-progress: false       # group cancels pending runs, skipping briefs

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      UNLOCK_TOKEN: ${{ secrets.UNLOCK_TOKEN }}
      ICS_URL: ${{ secrets.ICS_URL }}
      CAL_WORK: ${{ secrets.CAL_WORK }}
      CAL_PERSONAL: ${{ secrets.CAL_PERSONAL }}
      CAL_FAMILY: ${{ secrets.CAL_FAMILY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code

      # A brief that is written but never delivered has been the failure mode
      # here for twelve days running, on a secret that was present but empty.
      # Say so at the top of the log rather than letting it surface as a quiet
      # line in the hot-cache a fortnight later.
      - name: Check delivery is configured
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning title=No delivery::NTFY_TOPIC is unset or empty — the brief will be written and pushed, but will not reach the phone."
          fi

      - name: Run the requested skill
        run: |
          set -uo pipefail
          skill="${{ github.event.inputs.skill }}"
          echo "Running scheduled skill: $skill"
          bash scripts/run-skill.sh "$skill" || true

      # Orphaned on-demand triggers (a crashed run, or a push that never fired
      # the on-demand workflow) would otherwise wait for the next .run commit.
      - name: Sweep leftover queued runs
        run: bash scripts/process-queue.sh leftover

      - name: Commit results
        run: |
          bash scripts/commit-and-push.sh "scheduled-skills: results $(date -u +%FT%TZ)" "life-vault scheduled-skills"
